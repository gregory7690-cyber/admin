<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter Manager — Novelora Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background:
        radial-gradient(circle at top right, rgba(255, 79, 163, .12), transparent 30%),
        #100b16;
    color: #fff;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.page {
    min-height: 100vh;
    padding: 24px;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
}

.back-btn {
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05);
    color: #fff;
    padding: 11px 16px;
    border-radius: 12px;
}

.back-btn:hover {
    background: rgba(255,255,255,.09);
}

.heading h1 {
    margin: 0;
    font-size: 27px;
}

.heading p {
    margin: 6px 0 0;
    color: #a99eac;
    font-size: 14px;
}

.book-context {
    color: #ff72b6;
}

.layout {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    gap: 20px;
    max-width: 1500px;
    margin: auto;
}

.panel {
    background: rgba(25, 17, 30, .92);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.2);
}

.panel-header {
    padding: 18px;
    border-bottom: 1px solid rgba(255,255,255,.07);
}

.panel-header h2 {
    margin: 0;
    font-size: 17px;
}

.search {
    margin-top: 14px;
    width: 100%;
    padding: 12px 14px;
    background: #0b080d;
    color: #fff;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 11px;
    outline: none;
}

.search:focus,
.input:focus,
.textarea:focus,
.select:focus {
    border-color: rgba(255,105,180,.65);
}

.chapter-list {
    max-height: calc(100vh - 250px);
    overflow-y: auto;
    padding: 10px;
}

.chapter-item {
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 7px;
    border: 1px solid transparent;
    background: rgba(255,255,255,.025);
    transition: .2s;
}

.chapter-item:hover {
    background: rgba(255,105,180,.07);
}

.chapter-item.active {
    border-color: rgba(255,105,180,.4);
    background: rgba(255,105,180,.09);
}

.chapter-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.chapter-number {
    color: #ff72b6;
    font-size: 12px;
    font-weight: 700;
}

.chapter-title {
    margin-top: 5px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
}

.chapter-meta {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 9px;
}

.badge {
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 10px;
    background: rgba(255,255,255,.08);
    color: #cfc4d0;
}

.badge.published {
    color: #77e6a8;
    background: rgba(74,222,128,.09);
}

.badge.draft {
    color: #ffc56b;
    background: rgba(255,193,7,.09);
}

.badge.free {
    color: #8bd5ff;
}

.empty-list {
    padding: 35px 20px;
    text-align: center;
    color: #8e828f;
    font-size: 13px;
}

.editor-panel {
    min-width: 0;
}

.editor-header {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.editor-header strong {
    font-size: 17px;
}

.editor-header span {
    color: #958996;
    font-size: 12px;
}

.editor-body {
    padding: 22px;
}

.form-grid {
    display: grid;
    grid-template-columns: 150px minmax(0,1fr);
    gap: 15px;
}

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #c9bdca;
    font-size: 12px;
    font-weight: 600;
}

.input,
.select,
.textarea {
    width: 100%;
    border: 1px solid rgba(255,255,255,.1);
    background: #0b080d;
    color: #fff;
    border-radius: 11px;
    outline: none;
}

.input,
.select {
    padding: 12px 13px;
}

.textarea {
    min-height: 430px;
    padding: 17px;
    resize: vertical;
    line-height: 1.8;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.option-card {
    flex: 1;
    min-width: 180px;
    padding: 14px;
    border-radius: 13px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.07);
}

.option-card label {
    margin: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
}

.option-card input[type="checkbox"] {
    accent-color: #ff4fa3;
    width: 17px;
    height: 17px;
}

.actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.07);
}

.left-actions,
.right-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    border: 0;
    border-radius: 11px;
    padding: 12px 17px;
    font-weight: 700;
}

.btn-primary {
    color: #fff;
    background: linear-gradient(135deg, #ff4fa3, #d92f84);
}

.btn-secondary {
    color: #fff;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.09);
}

.btn-danger {
    color: #ff9abd;
    background: rgba(255,55,125,.09);
    border: 1px solid rgba(255,55,125,.15);
}

.btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.pagination {
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,.07);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}

.page-info {
    color: #9c909d;
    font-size: 11px;
}

.page-buttons {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.page-btn {
    min-width: 31px;
    height: 31px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    color: #fff;
}

.page-btn.active {
    background: #ff4fa3;
    border-color: #ff4fa3;
}

.message {
    display: none;
    padding: 12px 14px;
    border-radius: 11px;
    margin-bottom: 16px;
    font-size: 13px;
}

.message.error {
    display: block;
    color: #ff9aaa;
    background: rgba(255,50,90,.08);
    border: 1px solid rgba(255,50,90,.15);
}

.message.success {
    display: block;
    color: #7ff0ad;
    background: rgba(74,222,128,.08);
    border: 1px solid rgba(74,222,128,.15);
}

.loading {
    text-align: center;
    padding: 50px 20px;
    color: #9b8f9c;
}

@media (max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .chapter-list {
        max-height: 400px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .page {
        padding: 14px;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .heading h1 {
        font-size: 23px;
    }

    .editor-body {
        padding: 16px;
    }

    .textarea {
        min-height: 350px;
    }

    .actions {
        align-items: stretch;
        flex-direction: column;
    }

    .left-actions,
    .right-actions {
        width: 100%;
    }

    .btn {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="topbar">
        <div class="heading">
            <h1>Chapter Manager</h1>
            <p>
                Managing chapters for
                <span class="book-context" id="bookName">Loading book...</span>
            </p>
        </div>

        <button class="back-btn" onclick="location.href='books.html'">
            ← Back to Books
        </button>
    </div>

    <div id="message" class="message"></div>

    <div id="missingBook" class="panel" style="display:none;">
        <div class="empty-list">
            <h3>Book not found</h3>
            <p>This chapter manager needs a valid book ID.</p>
            <button class="btn btn-primary" onclick="location.href='books.html'">
                Return to Books
            </button>
        </div>
    </div>

    <div class="layout" id="chapterWorkspace">

        <!-- CHAPTER LIST -->
        <section class="panel">

            <div class="panel-header">
                <h2>Chapters</h2>

                <input
                    class="search"
                    id="chapterSearch"
                    type="search"
                    placeholder="Search chapters..."
                >
            </div>

            <div class="chapter-list" id="chapterList">
                <div class="loading">Loading chapters...</div>
            </div>

            <div class="pagination">
                <span class="page-info" id="pageInfo">Page 1</span>

                <div class="page-buttons" id="pagination"></div>
            </div>

        </section>

        <!-- EDITOR -->
        <section class="panel editor-panel">

            <div class="editor-header">
                <div>
                    <strong id="editorHeading">New Chapter</strong>
                    <br>
                    <span id="editorSubheading">Create a chapter for this book</span>
                </div>
            </div>

            <div class="editor-body">

                <div id="editorMessage" class="message"></div>

                <div class="form-grid">

                    <div class="field">
                        <label>Chapter Number</label>

                        <input
                            class="input"
                            id="chapterNumber"
                            type="number"
                            min="1"
                            placeholder="1"
                        >
                    </div>

                    <div class="field">
                        <label>Chapter Title</label>

                        <input
                            class="input"
                            id="chapterTitle"
                            type="text"
                            placeholder="Enter chapter title"
                        >
                    </div>

                </div>

                <div class="field">
                    <label>Chapter Content</label>

                    <textarea
                        class="textarea"
                        id="chapterContent"
                        placeholder="Start writing your chapter here..."
                    ></textarea>
                </div>

                <div class="options">

                    <div class="option-card">
                        <label>
                            <input
                                type="checkbox"
                                id="isFree"
                            >
                            <span>
                                <strong>Free Chapter</strong><br>
                                <small style="color:#8e828f;">
                                    Readers can read without coins.
                                </small>
                            </span>
                        </label>
                    </div>

                    <div class="option-card">
                        <label style="display:block;">
                            <span>Coin Price</span>

                            <input
                                class="input"
                                id="coinPrice"
                                type="number"
                                min="0"
                                value="5"
                                style="margin-top:8px;"
                            >
                        </label>
                    </div>

                    <div class="option-card">
                        <label style="display:block;">
                            <span>Status</span>

                            <select
                                class="select"
                                id="chapterStatus"
                                style="margin-top:8px;"
                            >
                                <option value="draft">Draft</option>
                                <option value="published">Published</option>
                            </select>
                        </label>
                    </div>

                </div>

                <div class="actions">

                    <div class="left-actions">
                        <button
                            class="btn btn-secondary"
                            id="newChapterBtn"
                            type="button"
                        >
                            + New Chapter
                        </button>

                        <button
                            class="btn btn-danger"
                            id="deleteBtn"
                            type="button"
                            style="display:none;"
                        >
                            Delete
                        </button>
                    </div>

                    <div class="right-actions">

                        <button
                            class="btn btn-secondary"
                            id="saveDraftBtn"
                            type="button"
                        >
                            Save Draft
                        </button>

                        <button
                            class="btn btn-primary"
                            id="publishBtn"
                            type="button"
                        >
                            Publish Chapter
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </div>
</div>


<script>
/* =========================================
   NOVELORA CHAPTER MANAGER
========================================= */

const params = new URLSearchParams(window.location.search);
const bookId = params.get("id");

const PAGE_SIZE = 10;

let chapters = [];
let filteredChapters = [];
let currentPage = 1;
let editingChapterId = null;
let selectedBook = null;


/* =========================================
   ELEMENTS
========================================= */

const bookName = document.getElementById("bookName");
const chapterList = document.getElementById("chapterList");
const chapterSearch = document.getElementById("chapterSearch");
const pagination = document.getElementById("pagination");
const pageInfo = document.getElementById("pageInfo");

const chapterNumber = document.getElementById("chapterNumber");
const chapterTitle = document.getElementById("chapterTitle");
const chapterContent = document.getElementById("chapterContent");
const isFree = document.getElementById("isFree");
const coinPrice = document.getElementById("coinPrice");
const chapterStatus = document.getElementById("chapterStatus");

const editorHeading = document.getElementById("editorHeading");
const editorSubheading = document.getElementById("editorSubheading");

const deleteBtn = document.getElementById("deleteBtn");
const saveDraftBtn = document.getElementById("saveDraftBtn");
const publishBtn = document.getElementById("publishBtn");
const newChapterBtn = document.getElementById("newChapterBtn");

const message = document.getElementById("message");
const editorMessage = document.getElementById("editorMessage");


/* =========================================
   MESSAGE HELPERS
========================================= */

function showMessage(element, text, type = "success") {
    element.textContent = text;
    element.className = "message " + type;

    setTimeout(() => {
        element.className = "message";
        element.textContent = "";
    }, 4000);
}


/* =========================================
   START
========================================= */

document.addEventListener("DOMContentLoaded", async () => {

    if (!bookId) {
        document.getElementById("chapterWorkspace").style.display = "none";
        document.getElementById("missingBook").style.display = "block";
        return;
    }

    await loadBook();
});


/* =========================================
   LOAD BOOK
========================================= */

async function loadBook() {

    const {
        data,
        error
    } = await supabaseClient
        .from("books")
        .select("id, title, status")
        .eq("id", bookId)
        .maybeSingle();

    if (error) {
        console.error(error);

        document.getElementById("chapterWorkspace").style.display = "none";
        document.getElementById("missingBook").style.display = "block";

        return;
    }

    if (!data) {
        document.getElementById("chapterWorkspace").style.display = "none";
        document.getElementById("missingBook").style.display = "block";

        return;
    }

    selectedBook = data;
    bookName.textContent = data.title;

    await loadChapters();
}


/* =========================================
   LOAD CHAPTERS
========================================= */

async function loadChapters() {

    chapterList.innerHTML =
        '<div class="loading">Loading chapters...</div>';

    const {
        data,
        error
    } = await supabaseClient
        .from("chapters")
        .select(`
            id,
            book_id,
            chapter_number,
            title,
            content,
            coin_price,
            is_free,
            status,
            views,
            created_at,
            updated_at
        `)
        .eq("book_id", bookId)
        .order("chapter_number", {
            ascending: true
        });

    if (error) {
        console.error(error);

        chapterList.innerHTML = `
            <div class="empty-list">
                Unable to load chapters.
            </div>
        `;

        showMessage(
            message,
            error.message || "Could not load chapters.",
            "error"
        );

        return;
    }

    chapters = data || [];

    filterChapters();

    if (!editingChapterId) {
        const nextNumber = getNextChapterNumber();

        chapterNumber.value = nextNumber;
    }
}


/* =========================================
   SEARCH
========================================= */

chapterSearch.addEventListener("input", () => {

    currentPage = 1;

    filterChapters();
});


function filterChapters() {

    const query =
        chapterSearch.value.trim().toLowerCase();

    if (!query) {

        filteredChapters = [...chapters];

    } else {

        filteredChapters = chapters.filter(chapter => {

            return (
                String(chapter.chapter_number)
                    .toLowerCase()
                    .includes(query) ||

                (chapter.title || "")
                    .toLowerCase()
                    .includes(query) ||

                (chapter.content || "")
                    .toLowerCase()
                    .includes(query)
            );

        });

    }

    renderChapters();
}


/* =========================================
   RENDER CHAPTER LIST
========================================= */

function renderChapters() {

    const totalPages =
        Math.max(
            1,
            Math.ceil(filteredChapters.length / PAGE_SIZE)
        );

    if (currentPage > totalPages) {
        currentPage = totalPages;
    }

    const start =
        (currentPage - 1) * PAGE_SIZE;

    const visible =
        filteredChapters.slice(
            start,
            start + PAGE_SIZE
        );

    if (!visible.length) {

        chapterList.innerHTML = `
            <div class="empty-list">
                ${
                    chapters.length
                        ? "No chapters match your search."
                        : "No chapters yet. Create your first chapter."
                }
            </div>
        `;

    } else {

        chapterList.innerHTML = visible
            .map(chapter => {

                const active =
                    chapter.id === editingChapterId
                        ? "active"
                        : "";

                const statusClass =
                    chapter.status === "published"
                        ? "published"
                        : "draft";

                const statusText =
                    chapter.status === "published"
                        ? "Published"
                        : "Draft";

                const freeBadge =
                    chapter.is_free
                        ? `<span class="badge free">Free</span>`
                        : `<span class="badge">${Number(chapter.coin_price || 0)} coins</span>`;

                return `
                    <div
                        class="chapter-item ${active}"
                        onclick="editChapter('${chapter.id}')"
                    >

                        <div class="chapter-top">
                            <span class="chapter-number">
                                CHAPTER ${chapter.chapter_number}
                            </span>
                        </div>

                        <div class="chapter-title">
                            ${escapeHtml(chapter.title || "Untitled Chapter")}
                        </div>

                        <div class="chapter-meta">
                            <span class="badge ${statusClass}">
                                ${statusText}
                            </span>

                            ${freeBadge}
                        </div>

                    </div>
                `;

            })
            .join("");

    }

    renderPagination(totalPages);
}


/* =========================================
   PAGINATION
========================================= */

function renderPagination(totalPages) {

    pageInfo.textContent =
        `Page ${currentPage} of ${totalPages}`;

    pagination.innerHTML = "";

    if (totalPages <= 1) {
        return;
    }

    const previous =
        document.createElement("button");

    previous.className = "page-btn";
    previous.textContent = "‹";
    previous.disabled = currentPage === 1;

    previous.onclick = () => {

        if (currentPage > 1) {
            currentPage--;
            renderChapters();
        }

    };

    pagination.appendChild(previous);


    for (
        let i = 1;
        i <= totalPages;
        i++
    ) {

        const btn =
            document.createElement("button");

        btn.className =
            "page-btn" +
            (i === currentPage ? " active" : "");

        btn.textContent = i;

        btn.onclick = () => {

            currentPage = i;

            renderChapters();

        };

        pagination.appendChild(btn);
    }


    const next =
        document.createElement("button");

    next.className = "page-btn";
    next.textContent = "›";
    next.disabled =
        currentPage === totalPages;

    next.onclick = () => {

        if (currentPage < totalPages) {
            currentPage++;
            renderChapters();
        }

    };

    pagination.appendChild(next);
}


/* =========================================
   NEW CHAPTER
========================================= */

newChapterBtn.addEventListener(
    "click",
    newChapter
);

function newChapter() {

    editingChapterId = null;

    editorHeading.textContent =
        "New Chapter";

    editorSubheading.textContent =
        "Create a chapter for this book";

    chapterNumber.value =
        getNextChapterNumber();

    chapterTitle.value = "";
    chapterContent.value = "";

    isFree.checked = false;
    coinPrice.value = 5;
    chapterStatus.value = "draft";

    deleteBtn.style.display = "none";

    renderChapters();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================
   NEXT CHAPTER NUMBER
========================================= */

function getNextChapterNumber() {

    if (!chapters.length) {
        return 1;
    }

    const numbers =
        chapters.map(
            c => Number(c.chapter_number) || 0
        );

    return Math.max(...numbers) + 1;
}


/* =========================================
   EDIT CHAPTER
========================================= */

window.editChapter = function(id) {

    const chapter =
        chapters.find(c => c.id === id);

    if (!chapter) {
        return;
    }

    editingChapterId = id;

    editorHeading.textContent =
        "Edit Chapter " +
        chapter.chapter_number;

    editorSubheading.textContent =
        "Update and save this chapter";

    chapterNumber.value =
        chapter.chapter_number;

    chapterTitle.value =
        chapter.title || "";

    chapterContent.value =
        chapter.content || "";

    isFree.checked =
        Boolean(chapter.is_free);

    coinPrice.value =
        Number(chapter.coin_price ?? 5);

    chapterStatus.value =
        chapter.status || "draft";

    deleteBtn.style.display =
        "inline-block";

    renderChapters();

    document.querySelector(".editor-panel")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
};


/* =========================================
   VALIDATION
========================================= */

function validateChapter() {

    const number =
        Number(chapterNumber.value);

    const title =
        chapterTitle.value.trim();

    const content =
        chapterContent.value.trim();

    const price =
        Number(coinPrice.value);

    if (!number || number < 1) {

        showMessage(
            editorMessage,
            "Enter a valid chapter number.",
            "error"
        );

        return null;
    }

    if (!title) {

        showMessage(
            editorMessage,
            "Enter a chapter title.",
            "error"
        );

        return null;
    }

    if (!content) {

        showMessage(
            editorMessage,
            "Chapter content cannot be empty.",
            "error"
        );

        return null;
    }

    if (price < 0 || Number.isNaN(price)) {

        showMessage(
            editorMessage,
            "Enter a valid coin price.",
            "error"
        );

        return null;
    }

    return {
        chapter_number: number,
        title,
        content,
        coin_price: isFree.checked ? 0 : price,
        is_free: isFree.checked,
        status: chapterStatus.value,
        updated_at: new Date().toISOString()
    };
}


/* =========================================
   SAVE DRAFT
========================================= */

saveDraftBtn.addEventListener(
    "click",
    () => saveChapter("draft")
);


/* =========================================
   PUBLISH
========================================= */

publishBtn.addEventListener(
    "click",
    () => saveChapter("published")
);


/* =========================================
   SAVE CHAPTER
========================================= */

async function saveChapter(status) {

    const payload =
        validateChapter();

    if (!payload) {
        return;
    }

    payload.status = status;


    saveDraftBtn.disabled = true;
    publishBtn.disabled = true;

    try {

        if (editingChapterId) {

            const {
                data,
                error
            } = await supabaseClient
                .from("chapters")
                .update(payload)
                .eq("id", editingChapterId)
                .eq("book_id", bookId)
                .select()
                .maybeSingle();

            if (error) {
                throw error;
            }

            if (!data) {
                throw new Error(
                    "Chapter could not be updated."
                );
            }

            showMessage(
                message,
                status === "published"
                    ? "Chapter published successfully."
                    : "Chapter saved as draft.",
                "success"
            );

        } else {

            const insertPayload = {
                ...payload,
                book_id: bookId,
                created_at: new Date().toISOString()
            };

            const {
                data,
                error
            } = await supabaseClient
                .from("chapters")
                .insert(insertPayload)
                .select()
                .maybeSingle();

            if (error) {
                throw error;
            }

            if (!data) {
                throw new Error(
                    "Chapter could not be created."
                );
            }

            editingChapterId =
                data.id;

            showMessage(
                message,
                status === "published"
                    ? "Chapter published successfully."
                    : "Chapter saved as draft.",
                "success"
            );
        }


        await loadChapters();

        const savedChapter =
            chapters.find(
                c => c.id === editingChapterId
            );

        if (savedChapter) {

            chapterNumber.value =
                savedChapter.chapter_number;

            chapterTitle.value =
                savedChapter.title || "";

            chapterContent.value =
                savedChapter.content || "";

            isFree.checked =
                Boolean(savedChapter.is_free);

            coinPrice.value =
                Number(savedChapter.coin_price ?? 5);

            chapterStatus.value =
                savedChapter.status || status;

            editorHeading.textContent =
                "Edit Chapter " +
                savedChapter.chapter_number;

            editorSubheading.textContent =
                "Update and save this chapter";

            deleteBtn.style.display =
                "inline-block";
        }

    } catch (error) {

        console.error(error);

        let errorText =
            error.message ||
            "Unable to save chapter.";

        if (
            errorText.includes("duplicate") ||
            errorText.includes("chapters_book_id_chapter_number_key")
        ) {
            errorText =
                "That chapter number already exists for this book.";
        }

        showMessage(
            message,
            errorText,
            "error"
        );

    } finally {

        saveDraftBtn.disabled = false;
        publishBtn.disabled = false;
    }
}


/* =========================================
   DELETE
========================================= */

deleteBtn.addEventListener(
    "click",
    deleteChapter
);

async function deleteChapter() {

    if (!editingChapterId) {
        return;
    }

    const chapter =
        chapters.find(
            c => c.id === editingChapterId
        );

    if (!chapter) {
        return;
    }

    const confirmed =
        confirm(
            `Delete Chapter ${chapter.chapter_number}: "${chapter.title}"?\n\nThis cannot be undone.`
        );

    if (!confirmed) {
        return;
    }

    deleteBtn.disabled = true;

    try {

        const {
            error
        } = await supabaseClient
            .from("chapters")
            .delete()
            .eq("id", editingChapterId)
            .eq("book_id", bookId);

        if (error) {
            throw error;
        }

        showMessage(
            message,
            "Chapter deleted successfully.",
            "success"
        );

        newChapter();

        await loadChapters();

    } catch (error) {

        console.error(error);

        showMessage(
            message,
            error.message ||
            "Unable to delete chapter.",
            "error"
        );

    } finally {

        deleteBtn.disabled = false;
    }
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
